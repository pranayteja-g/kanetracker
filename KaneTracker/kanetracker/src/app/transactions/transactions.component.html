<div class="page" *ngIf="loaded">
  <header class="top">
    <h1>History</h1>
    <button class="icon-btn" (click)="search()" aria-label="Search"><mat-icon>search</mat-icon></button>
  </header>

  <ng-container *ngIf="hasAny; else empty">
    <div class="chips">
      <button *ngFor="let f of filters" class="chip" [class.on]="f.v === filter" (click)="setFilter(f.v)">{{ f.l }}</button>
    </div>

    <section class="day" *ngFor="let g of groups">
      <div class="day-h"><h2>{{ g.label }}</h2><span class="muted" *ngIf="g.spent">−{{ g.spent | inr }}</span></div>
      <div class="swipe" *ngFor="let t of g.items">
        <div class="bg l"><mat-icon>edit</mat-icon></div>
        <div class="bg r"><mat-icon>delete_outline</mat-icon></div>
        <div class="row-fg" kSwipe #sw="kSwipe" (swipeLeft)="remove(t)" (swipeRight)="open(t, sw, true)">
          <button class="tx" (click)="open(t, sw)">
            <i [style.background]="color(t.category)"></i>
            <span class="m"><b>{{ t.category }}</b>
              <span *ngIf="t.description || t.account || t.tags?.length">{{ t.description }}<ng-container *ngIf="t.account"> · {{ t.account }}</ng-container><ng-container *ngFor="let tg of t.tags"> #{{ tg }}</ng-container></span></span>
            <mat-icon class="mini" *ngIf="t.receipt">photo_camera</mat-icon>
            <mat-icon class="mini" *ngIf="t.recurringId">repeat</mat-icon>
            <span class="a" [class.income]="t.type === 'income'">{{ t.type === 'income' ? '+' : '−' }}{{ t.amount | inr }}</span>
          </button>
          <button class="dup" (click)="dup(t)" aria-label="Duplicate"><mat-icon>content_copy</mat-icon></button>
        </div>
      </div>
    </section>

    <p class="muted none" *ngIf="!groups.length">Nothing here</p>
    <button class="btn ghost more" *ngIf="hasMore" (click)="more()">Show more</button>
  </ng-container>

  <ng-template #empty>
    <div class="empty">
      <mat-icon>receipt_long</mat-icon>
      <p>No transactions yet</p>
      <a routerLink="/transaction-form" class="btn">Add first</a>
    </div>
  </ng-template>
</div>
