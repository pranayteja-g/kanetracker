<form class="form" [formGroup]="form" (ngSubmit)="save()">
  <header class="bar">
    <button type="button" class="icon-btn" (click)="close()" aria-label="Close"><mat-icon>close</mat-icon></button>
    <div class="seg" role="tablist">
      <button type="button" role="tab" [class.on]="type === 'expense'" (click)="setType('expense')">Expense</button>
      <button type="button" role="tab" [class.on]="type === 'income'" (click)="setType('income')">Income</button>
    </div>
    <span class="sp"></span>
  </header>

  <div class="amt">
    <span>₹</span>
    <input #amount formControlName="amount" type="number" inputmode="decimal" placeholder="0"
      min="0.01" max="10000000" step="0.01" aria-label="Amount" />
  </div>

  <p class="label">Category</p>
  <div class="cats">
    <button type="button" class="cat" *ngFor="let c of categories"
      [class.on]="form.controls.category.value === c.name" (click)="pick(c.name)">
      <i [style.background]="c.color"></i>{{ c.name }}
    </button>
    <button type="button" class="cat add" (click)="addCategory()"><mat-icon>add</mat-icon>New</button>
  </div>

  <div class="fields">
    <label><mat-icon>event</mat-icon><input type="date" formControlName="date" [max]="maxDate" aria-label="Date" /></label>
    <label><mat-icon>notes</mat-icon><input type="text" formControlName="description" maxlength="200"
        placeholder="Note (optional)" aria-label="Note" /></label>
  </div>

  <footer class="cta">
    <button class="btn save" type="submit" [disabled]="!canSave">{{ saving ? 'Saving…' : 'Save' }}</button>
  </footer>
</form>
