<form class="form" [formGroup]="form" (ngSubmit)="save()">
  <header class="bar">
    <button type="button" class="icon-btn" (click)="close()" aria-label="Close"><mat-icon>close</mat-icon></button>
    <div class="seg" role="tablist">
      <button type="button" role="tab" [class.on]="type === 'expense'" (click)="setType('expense')">Expense</button>
      <button type="button" role="tab" [class.on]="type === 'income'" (click)="setType('income')">Income</button>
    </div>
    <span class="sp"></span>
  </header>

  <div class="amt">
    <select class="cur" formControlName="currency" aria-label="Currency">
      <option *ngFor="let c of currencies" [value]="c">{{ sym(c) }}</option>
    </select>
    <input #amount formControlName="amount" type="number" inputmode="decimal" placeholder="0"
      min="0.01" max="10000000" step="0.01" aria-label="Amount" />
  </div>
  <p class="conv muted" *ngIf="converted !== null">≈ {{ converted | inr }} at {{ rates[form.controls.currency.value] }}</p>

  <div class="presets">
    <button type="button" class="chip" *ngFor="let p of presets" (click)="setAmount(p)">{{ p }}</button>
  </div>

  <p class="label">Category</p>
  <div class="cats">
    <button type="button" class="cat" *ngFor="let c of categories"
      [class.on]="form.controls.category.value === c.name" (click)="pick(c.name)">
      <i [style.background]="c.color"></i>{{ c.name }}
    </button>
    <button type="button" class="cat add" (click)="addCategory()"><mat-icon>add</mat-icon>New</button>
  </div>

  <p class="label">Account</p>
  <div class="cats">
    <button type="button" class="cat" *ngFor="let a of accounts"
      [class.on]="form.controls.account.value === a" (click)="toggleAccount(a)">{{ a }}</button>
  </div>

  <div class="fields">
    <label><mat-icon>event</mat-icon><input type="date" formControlName="date" [max]="maxDate" aria-label="Date" /></label>
    <label><mat-icon>notes</mat-icon><input type="text" formControlName="description" maxlength="200"
        placeholder="Note (optional)" aria-label="Note" /></label>
    <label><mat-icon>sell</mat-icon><input type="text" formControlName="tags"
        placeholder="Tags: trip, work (optional)" aria-label="Tags" autocapitalize="none" /></label>
    <label><mat-icon>repeat</mat-icon>
      <select formControlName="repeat" aria-label="Repeat">
        <option value="none">Does not repeat</option>
        <option value="daily">Repeats daily</option>
        <option value="weekly">Repeats weekly</option>
        <option value="monthly">Repeats monthly</option>
        <option value="yearly">Repeats yearly</option>
      </select></label>
    <label class="file"><mat-icon>photo_camera</mat-icon>
      <span>{{ receipt ? 'Receipt attached' : 'Attach receipt' }}</span>
      <img *ngIf="receipt" [src]="receipt" alt="Receipt" />
      <button type="button" *ngIf="receipt" class="icon-btn" (click)="receipt = ''; $event.preventDefault()" aria-label="Remove receipt"><mat-icon>close</mat-icon></button>
      <input type="file" accept="image/*" hidden (change)="onFile($event)" />
    </label>
  </div>

  <footer class="cta">
    <button class="btn save" type="submit" [disabled]="!canSave">{{ saving ? 'Saving…' : 'Save' }}</button>
  </footer>
</form>
