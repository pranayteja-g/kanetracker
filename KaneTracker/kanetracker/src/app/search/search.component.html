<div class="page" *ngIf="loaded">
  <div class="sbar">
    <mat-icon>search</mat-icon>
    <input type="search" [(ngModel)]="query" (ngModelChange)="onQuery()" placeholder="Search notes or category"
      aria-label="Search" autofocus enterkeyhint="search" />
    <button class="icon-btn" *ngIf="query" (click)="query = ''; run()" aria-label="Clear"><mat-icon>close</mat-icon></button>
  </div>

  <div class="chips">
    <button *ngFor="let t of types" class="chip" [class.on]="t.v === type" (click)="setType(t.v)">{{ t.l }}</button>
  </div>
  <div class="chips">
    <button *ngFor="let d of dates" class="chip" [class.on]="d.v === date" (click)="setDate(d.v)">{{ d.l }}</button>
  </div>

  <div class="custom" *ngIf="date === 'custom'">
    <label><span class="label">From</span><input type="date" [(ngModel)]="from" [max]="to" (ngModelChange)="run()" /></label>
    <label><span class="label">To</span><input type="date" [(ngModel)]="to" [min]="from" (ngModelChange)="run()" /></label>
  </div>

  <button class="more-btn" (click)="more = !more" [attr.aria-expanded]="more">
    <mat-icon>tune</mat-icon>More filters<mat-icon class="chev" [class.up]="more">expand_more</mat-icon>
  </button>

  <div class="panel" *ngIf="more">
    <label><span class="label">Category</span>
      <select [(ngModel)]="category" (ngModelChange)="run()">
        <option value="">All</option>
        <option *ngFor="let c of categories" [value]="c.name">{{ c.name }}</option>
      </select></label>
    <label><span class="label">Sort</span>
      <select [(ngModel)]="sort" (ngModelChange)="run()">
        <option *ngFor="let s of sorts" [value]="s.v">{{ s.l }}</option>
      </select></label>
    <label><span class="label">Min ₹</span><input type="number" inputmode="decimal" [(ngModel)]="min" (ngModelChange)="run()" placeholder="0" /></label>
    <label><span class="label">Max ₹</span><input type="number" inputmode="decimal" [(ngModel)]="max" (ngModelChange)="run()" placeholder="Any" /></label>
  </div>

  <div class="sum">
    <span class="muted">{{ results.length }} result{{ results.length === 1 ? '' : 's' }}
      <ng-container *ngIf="results.length"> · <span *ngIf="expense">−{{ expense | inr }}</span><span *ngIf="expense && income"> </span><span class="inc" *ngIf="income">+{{ income | inr }}</span></ng-container>
    </span>
    <button class="link" *ngIf="active" (click)="clear()">Reset</button>
  </div>

  <div class="list">
    <button class="tx" *ngFor="let i of shown" (click)="open(i)">
      <i [style.background]="color(i.tx.category)"></i>
      <span class="m"><b>{{ i.tx.category }}</b><span>{{ i.tx.description ? i.tx.description + ' · ' : '' }}{{ i.tx.date | date:'d MMM y' }}</span></span>
      <span class="a" [class.income]="i.tx.type === 'income'">{{ i.tx.type === 'income' ? '+' : '−' }}{{ i.tx.amount | inr }}</span>
    </button>
  </div>

  <div class="empty" *ngIf="!results.length">
    <mat-icon>search_off</mat-icon>
    <p>No matches</p>
    <button class="btn ghost" *ngIf="active" (click)="clear()">Reset filters</button>
  </div>
  <button class="btn ghost showmore" *ngIf="hasMore" (click)="showMore()">Show more</button>
</div>
